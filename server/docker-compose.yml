networks:
  chat-net:
    driver: bridge

services:
  chat-service-db:
    image: postgres:13.4-alpine
    restart: always
    container_name: chat-service-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    networks:
      - chat-net

  chat-service-server:
    env_file: .env
    container_name: chat-service-server
    build:
      context: ./
    command: ["node", "dist/main.api"]
    depends_on:
      - chat-service-db
    ports:
      - '3009:3009'
    networks:
      - chat-net
